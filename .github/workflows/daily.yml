name: spc-rates-daily
on:
  schedule:
    # 한국시간 월~금 06:07·06:37·07:07 (전 영업일 발행분). 앞 실행이 성공하면 뒤 실행은 바로 끝난다.
    # 정시·30분은 GitHub 예약이 몰려 몇 시간씩 밀린다(2026-11-20: 06:00 예약이 08시 넘도록 시작 안 함) -> 7분·37분.
    # PC 보충 실행은 윈도우 로그인 3분 뒤(평일 07:30 포함).
    - cron: "7,37 21 * * 0-4"
    - cron: "7 22 * * 0-4"
  workflow_dispatch:
    inputs:
      start_date:
        description: "밀린 날짜 채우기 시작일 (예 2026-11-03). 비워 두면 전 영업일 하루"
        required: false
        default: ""
      end_date:
        description: "채우기 종료일 (비우면 전 영업일까지)"
        required: false
        default: ""
concurrency:
  group: spc-rates            # 과거분 채우기와 동시에 돌지 않게
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build rows for the previous business day
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
          RUN_MINUTES: "300"   # 이 시간이 지나면 새 날짜를 시작하지 않고 저장·커밋
          USE_KR: "1"          # 한기평도 조회(NICE가 GitHub 서버를 막아서. 2026-11-22 비교 시험 뒤 켬)
        run: python run_daily.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs state
          git commit -m "update $(date -u +%F)" || echo "no changes"
          git pull --rebase
          git push
