name: spc-rates-backfill
# 최근 약 2년치(2024-11-18~)를 최근부터 거꾸로 조금씩 채운다. 이미 채운 날짜는 건너뛴다.
on:
  schedule:
    # 한국시간 매일 00:07 (정시는 예약이 몰려 밀린다: 2026-11-20 00:00 예약이 07:29에 시작).
    # 비어 있는 전 영업일을 먼저 채우므로 아침 매일 실행 대신 이것 하나만 예약한다(사용자 2026-11-23).
    - cron: "7 15 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "이번에 채울 영업일 수"
        required: false
        default: "5"
concurrency:
  group: spc-rates
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Backfill past business days
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.days || '5' }}
          BACKFILL_FROM: "2024-11-18"
          RUN_MINUTES: "300"   # 이 시간이 지나면 새 날짜를 시작하지 않고 저장·커밋
          USE_KR: "1"          # 한기평도 조회(NICE가 GitHub 서버를 막아서. 2026-11-22 비교 시험 뒤 켬)
        run: python run_daily.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs state
          git commit -m "backfill $(date -u +%F)" || echo "no changes"
          git pull --rebase
          git push
