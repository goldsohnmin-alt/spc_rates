name: spc-rates-backfill
# 최근 약 2년치(2024-11-18~)를 최근부터 거꾸로 조금씩 채운다. 이미 채운 날짜는 건너뛴다.
on:
  schedule:
    - cron: "0 15 * * *"        # 한국시간 매일 00:00
  workflow_dispatch:
    inputs:
      days:
        description: "이번에 채울 영업일 수"
        required: false
        default: "5"
concurrency:
  group: spc-rates
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Backfill past business days
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.days || '5' }}
          BACKFILL_FROM: "2024-11-18"
        run: python run_daily.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs state
          git commit -m "backfill $(date -u +%F)" || echo "no changes"
          git pull --rebase
          git push
