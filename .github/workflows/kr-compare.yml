name: kr-compare-test
# 한기평 비교 시험(수동 실행만): NICE 없이 한기평+한신평으로 기간을 다시 만들어 지금 사이트 값과 비교한다.
# 아무것도 커밋하지 않는다(읽기 권한만). 결과는 실행 화면의 Summary 에 표로 나온다.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "시작일"
        default: "2026-11-09"
      end_date:
        description: "종료일"
        default: "2026-11-19"
concurrency:
  group: kr-compare           # 매일 실행을 몇 시간씩 붙잡지 않도록 따로 둔다(낮에 수동으로 돌린다)
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rebuild without NICE and compare
        env:
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: python compare_kr.py
